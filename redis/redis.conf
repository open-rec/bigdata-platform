# ---------------------------------------------------------------------------
# Redis for open-rec's serving layer: the recall tables, user/item rows and
# behaviour events that rec-server reads on every request. The key layout is
# defined in recall-engine/redis/design.md.
#
# Bind-mounted read-only into the container. maxmemory and maxmemory-policy are
# passed on the command line from .env (command-line options override this
# file), so tune those there rather than here.
# ---------------------------------------------------------------------------

bind 0.0.0.0
protected-mode no
port 6379
timeout 0
tcp-keepalive 300

# No requirepass on purpose — none of the open-rec clients authenticate. See
# the redis section of ../.env.

# --- persistence -----------------------------------------------------------
# AOF plus RDB snapshots: reloading a seeded dataset after a restart beats
# re-running example/init every time.
appendonly yes
appendfsync everysec
dir /data
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000

# --- logging ---------------------------------------------------------------
# Empty logfile means stdout, which is what `platform.sh logs redis` reads.
logfile ""
loglevel notice

# --- sizing ----------------------------------------------------------------
# The ZSets behind i2i / hot / new recall are the memory hogs. ziplist limits
# stay at the defaults; raise them if you store very large per-item lists.
databases 16
