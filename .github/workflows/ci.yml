name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: |
          bash -n platform.sh
          find . -path './.git' -prune -o -name '*.sh' -type f -exec bash -n {} +
      - name: Validate Compose configuration
        run: docker compose config --quiet
