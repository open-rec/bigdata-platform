# ---------------------------------------------------------------------------
# Bind-mounted into every Spark container at /opt/spark/conf/spark-defaults.conf
# (see docker-compose.yml), so edits here take effect on `platform.sh restart
# spark-master spark-worker-1 ...` — no image rebuild needed.
# ---------------------------------------------------------------------------

# --- cluster ---------------------------------------------------------------
spark.master                        spark://spark-master:7077

# --- storage ---------------------------------------------------------------
spark.hadoop.fs.defaultFS           hdfs://namenode:8020
spark.sql.warehouse.dir             hdfs://namenode:8020/user/hive/warehouse

# --- event log / history server -------------------------------------------
# /spark-logs is created by the hdfs-init one-shot.
spark.eventLog.enabled              true
spark.eventLog.dir                  hdfs://namenode:8020/spark-logs
spark.history.fs.logDirectory       hdfs://namenode:8020/spark-logs

# --- general ---------------------------------------------------------------
spark.serializer                    org.apache.spark.serializer.KryoSerializer
spark.sql.shuffle.partitions        32
spark.sql.adaptive.enabled          true
spark.ui.showConsoleProgress        false

# --- Hive metastore (opt-in) ----------------------------------------------
# Uncomment once the `hive` profile is up, then restart the Spark services.
#
# Spark 3.5 embeds a Hive 2.3.9 metastore client, which does not reliably talk
# to a Hive 4 metastore. The hive-libs-init one-shot publishes Hive's own jars
# into the hive-libs volume (mounted read-only at /opt/hive-libs) so Spark can
# load a matching client instead. Keep the version below in step with
# HIVE_VERSION in .env.
#
# spark.sql.catalogImplementation     hive
# spark.hadoop.hive.metastore.uris    thrift://hive-metastore:9083
# spark.sql.hive.metastore.version    4.0.1
# spark.sql.hive.metastore.jars       path
# spark.sql.hive.metastore.jars.path  file:///opt/hive-libs/*

# --- Kafka ----------------------------------------------------------------
# The connector jars are baked into the image, so no --packages is needed.
# Inside this network the brokers are:
#   kafka-1:9092,kafka-2:9092,kafka-3:9092
# From the docker host they are:
#   localhost:19092,localhost:29092,localhost:39092
