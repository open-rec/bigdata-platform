# ---------------------------------------------------------------------------
# Baked into openrec/elasticsearch.
#
# Do not also pass these as environment variables: the Elasticsearch docker
# image turns env vars into -E overrides, and a setting present both here and
# on the command line makes the node refuse to start. Only ELASTIC_PASSWORD and
# ES_JAVA_OPTS are meant to come from the environment.
# ---------------------------------------------------------------------------

cluster.name: openrec-es
node.name: elasticsearch
network.host: 0.0.0.0
http.port: 9200

# Single node: no bootstrap quorum, and the transport TLS bootstrap check does
# not apply. Scaling out means issuing a cert per node from the same CA and
# replacing this with discovery.seed_hosts / cluster.initial_master_nodes.
discovery.type: single-node

# mlockall failures are a common reason for a container that will not start,
# and the payoff is small here.
bootstrap.memory_lock: false

xpack.license.self_generated.type: basic
xpack.security.enabled: true

# Certificates are generated by entrypoint.sh into config/certs on first start.
xpack.security.http.ssl.enabled: true
xpack.security.http.ssl.key: certs/elasticsearch/elasticsearch.key
xpack.security.http.ssl.certificate: certs/elasticsearch/elasticsearch.crt
xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt

xpack.security.transport.ssl.enabled: true
xpack.security.transport.ssl.key: certs/elasticsearch/elasticsearch.key
xpack.security.transport.ssl.certificate: certs/elasticsearch/elasticsearch.crt
xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
xpack.security.transport.ssl.verification_mode: certificate
