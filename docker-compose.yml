# ===========================================================================
# open-rec bigdata-platform
#
# Orchestration only. Every component is its own image, built from its own
# Dockerfile with its configuration baked in, so each one can also be deployed
# standalone (`docker run openrec/hadoop:3.3.6 namenode`) — see the header of
# each Dockerfile. What lives here is the wiring: which roles run, how they
# find each other, which ports reach the host, and in what order they start.
#
# Services are grouped into profiles; nothing starts unless its profile is on:
#
#   zookeeper      3-node ensemble (coordination for Kafka and HBase)
#   kafka          3 brokers + topic bootstrap
#   hdfs           namenode + 2 datanodes + directory bootstrap
#   yarn           resourcemanager + 2 nodemanagers
#   hive           postgres metastore db + metastore + hiveserver2
#   hbase          master + 2 regionservers + thrift gateway
#   spark          master + 2 workers + history server + jupyterlab
#   flink          jobmanager + 2 taskmanagers
#   airflow        LocalExecutor scheduler + API/UI + DAG processor
#   redis          serving-layer KV store for rec-server
#   elasticsearch  serving-layer vector index (TLS + auth)
#
# Use ./platform.sh with the peer `standalone` or `cluster` modes; it expands
# modes and individual components into profile dependency closures. Raw
# Compose works too, but you must list every profile yourself:
#
#   docker compose --profile zookeeper --profile hdfs --profile hbase up -d
#
# All versions, host ports and sizing live in .env.
# ===========================================================================

networks:
  openrec-bigdata:
    name: openrec-bigdata
    driver: bridge

volumes:
  zk-data-1:
  zk-data-2:
  zk-data-3:
  zk-datalog-1:
  zk-datalog-2:
  zk-datalog-3:
  kafka-data-1:
  kafka-data-2:
  kafka-data-3:
  namenode-data:
  datanode-data-1:
  datanode-data-2:
  hive-pgdata:
  # Hive's jars, published by hive-libs-init so Spark can drive a Hive 4
  # metastore with a matching client (see spark/conf/spark-defaults.conf).
  hive-libs:
  # Shared scratch space for Spark workers and JupyterLab.
  spark-workspace:
  # Shared submission directory for Flink jars.
  flink-jobs:
  airflow-pgdata:
  airflow-logs:
  redis-data:
  elastic-data:
  # CA and node certificate, generated by the elasticsearch image on first run.
  elastic-certs:

# --- shared per-component image definitions --------------------------------
# One build stanza per image, reused by every role that runs it. Anything a
# service sets for itself wins over these.
x-zookeeper: &zookeeper-image
  image: ${IMAGE_PREFIX}/zookeeper:${ZOOKEEPER_VERSION}
  build:
    context: ./zookeeper
    args:
      JRE_BASE_IMAGE: ${JRE_BASE_IMAGE}
      ZOOKEEPER_VERSION: ${ZOOKEEPER_VERSION}
  restart: unless-stopped
  networks: [openrec-bigdata]

x-kafka: &kafka-image
  image: ${IMAGE_PREFIX}/kafka:${KAFKA_VERSION}
  build:
    context: ./kafka
    args:
      JRE_BASE_IMAGE: ${JRE_BASE_IMAGE}
      KAFKA_VERSION: ${KAFKA_VERSION}
      KAFKA_SCALA_VERSION: ${KAFKA_SCALA_VERSION}
  restart: unless-stopped
  networks: [openrec-bigdata]

x-hadoop: &hadoop-image
  image: ${IMAGE_PREFIX}/hadoop:${HADOOP_VERSION}
  build:
    context: ./hadoop
    args:
      HADOOP_BASE_IMAGE: ${HADOOP_BASE_IMAGE}
  restart: unless-stopped
  networks: [openrec-bigdata]

x-hive: &hive-image
  image: ${IMAGE_PREFIX}/hive:${HIVE_VERSION}
  build:
    context: ./hive
    args:
      HIVE_BASE_IMAGE: ${HIVE_BASE_IMAGE}
      PG_JDBC_VERSION: ${PG_JDBC_VERSION}
  restart: unless-stopped
  networks: [openrec-bigdata]

x-hbase: &hbase-image
  image: ${IMAGE_PREFIX}/hbase:${HBASE_VERSION}
  build:
    context: ./hbase
    args:
      HBASE_JDK_IMAGE: ${JRE_BASE_IMAGE}
      HBASE_VERSION: ${HBASE_VERSION}
  restart: unless-stopped
  networks: [openrec-bigdata]

x-spark: &spark-image
  image: ${IMAGE_PREFIX}/spark:${SPARK_VERSION}
  build:
    context: ./spark
    args:
      SPARK_BASE_IMAGE: ${SPARK_BASE_IMAGE}
      SPARK_VERSION: ${SPARK_VERSION}
      KAFKA_CLIENTS_VERSION: ${KAFKA_CLIENTS_VERSION}
      COMMONS_POOL2_VERSION: ${COMMONS_POOL2_VERSION}
      JUPYTERLAB_VERSION: ${JUPYTERLAB_VERSION}
      HAPPYBASE_VERSION: ${HAPPYBASE_VERSION}
  restart: unless-stopped
  networks: [openrec-bigdata]

x-flink: &flink-image
  image: ${IMAGE_PREFIX}/flink:${FLINK_VERSION}
  build:
    context: ./flink
    args:
      FLINK_BASE_IMAGE: ${FLINK_BASE_IMAGE}
      FLINK_VERSION: ${FLINK_VERSION}
      FLINK_HADOOP_UBER_VERSION: ${FLINK_HADOOP_UBER_VERSION}
      FROCKSDBJNI_VERSION: ${FROCKSDBJNI_VERSION}
  restart: unless-stopped
  networks: [openrec-bigdata]

x-airflow: &airflow-common
  image: ${AIRFLOW_IMAGE}
  restart: unless-stopped
  user: "${AIRFLOW_UID}:0"
  networks: [openrec-bigdata]
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # LocalExecutor workers run inside the scheduler container. Airflow 3 otherwise derives
    # http://localhost:8080/execution/, where no API server exists in that container.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    # Airflow 3 generates a random value per process when this is omitted, causing task JWTs from
    # the scheduler to fail signature validation in the separate API server container.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USERS}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_manager_passwords.json.generated
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
  volumes: &airflow-volumes
    - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs

# Config bind-mounted over what the image bakes in, so edits take effect on
# restart instead of needing a rebuild.
x-spark-conf: &spark-conf
  - spark-workspace:/opt/workspace
  - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
  - hive-libs:/opt/hive-libs:ro

x-flink-conf: &flink-conf
  - flink-jobs:/opt/flink/jobs
  - ./hadoop/conf/core-site.xml:/opt/hadoop/conf/core-site.xml:ro
  - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/conf/hdfs-site.xml:ro

x-hive-conf: &hive-conf
  - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
  # The upstream Hive image's Hadoop client defaults to file:///. Hive SQL
  # reads fs.defaultFS from hive-site.xml, but hdfs CLI and Tez also need the
  # platform's core/YARN settings in Hadoop's own configuration directory.
  - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
  - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
  - ./hadoop/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
  - ./hadoop/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

services:

  # =========================================================================
  # ZooKeeper — profile: zookeeper
  # All three nodes listen on 2181 *inside* the network; only the published
  # host ports differ. HBase builds its connect string from one shared
  # clientPort, so a uniform port is what keeps the quorum string simple.
  # =========================================================================
  zookeeper-1:
    <<: *zookeeper-image
    container_name: zookeeper-1
    hostname: zookeeper-1
    profiles: ["zookeeper"]
    command: ["server"]
    ports:
      - "${ZK1_CLIENT_PORT}:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: "server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181"
      SERVER_JVMFLAGS: "-Xmx${ZOOKEEPER_HEAP}m"
    volumes:
      - zk-data-1:/var/lib/zookeeper/data
      - zk-datalog-1:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181; printf srvr >&3; grep -q Mode <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  zookeeper-2:
    <<: *zookeeper-image
    container_name: zookeeper-2
    hostname: zookeeper-2
    profiles: ["zookeeper"]
    command: ["server"]
    ports:
      - "${ZK2_CLIENT_PORT}:2181"
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: "server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181"
      SERVER_JVMFLAGS: "-Xmx${ZOOKEEPER_HEAP}m"
    volumes:
      - zk-data-2:/var/lib/zookeeper/data
      - zk-datalog-2:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181; printf srvr >&3; grep -q Mode <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  zookeeper-3:
    <<: *zookeeper-image
    container_name: zookeeper-3
    hostname: zookeeper-3
    profiles: ["zookeeper"]
    command: ["server"]
    ports:
      - "${ZK3_CLIENT_PORT}:2181"
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: "server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181"
      SERVER_JVMFLAGS: "-Xmx${ZOOKEEPER_HEAP}m"
    volumes:
      - zk-data-3:/var/lib/zookeeper/data
      - zk-datalog-3:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181; printf srvr >&3; grep -q Mode <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # =========================================================================
  # Kafka — profile: kafka
  # Two listeners per broker:
  #   INTERNAL kafka-N:9092           for clients inside this network
  #   EXTERNAL localhost:<host port>  for clients on the docker host
  # That is what lets rec-server on the host connect without /etc/hosts edits.
  #
  # KAFKA_* variables become server.properties entries (broker.id,
  # advertised.listeners, ...) — see kafka/entrypoint.sh.
  # =========================================================================
  kafka-1:
    <<: *kafka-image
    container_name: kafka-1
    hostname: kafka-1
    profiles: ["kafka"]
    command: ["broker"]
    depends_on:
      zookeeper-1: {condition: service_healthy}
      zookeeper-2: {condition: service_healthy}
      zookeeper-3: {condition: service_healthy}
    ports:
      - "${KAFKA1_EXTERNAL_PORT}:${KAFKA1_EXTERNAL_PORT}"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:${KAFKA1_EXTERNAL_PORT}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:${KAFKA1_EXTERNAL_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
    volumes:
      - kafka-data-1:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 45s

  kafka-2:
    <<: *kafka-image
    container_name: kafka-2
    hostname: kafka-2
    profiles: ["kafka"]
    command: ["broker"]
    depends_on:
      zookeeper-1: {condition: service_healthy}
      zookeeper-2: {condition: service_healthy}
      zookeeper-3: {condition: service_healthy}
    ports:
      - "${KAFKA2_EXTERNAL_PORT}:${KAFKA2_EXTERNAL_PORT}"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:${KAFKA2_EXTERNAL_PORT}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:${KAFKA2_EXTERNAL_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
    volumes:
      - kafka-data-2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 45s

  kafka-3:
    <<: *kafka-image
    container_name: kafka-3
    hostname: kafka-3
    profiles: ["kafka"]
    command: ["broker"]
    depends_on:
      zookeeper-1: {condition: service_healthy}
      zookeeper-2: {condition: service_healthy}
      zookeeper-3: {condition: service_healthy}
    ports:
      - "${KAFKA3_EXTERNAL_PORT}:${KAFKA3_EXTERNAL_PORT}"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:${KAFKA3_EXTERNAL_PORT}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:${KAFKA3_EXTERNAL_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
    volumes:
      - kafka-data-3:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 45s

  # One-shot: creates the topics rec-server publishes to. Idempotent, so
  # `./platform.sh init` can re-run it any time.
  kafka-init:
    <<: *kafka-image
    container_name: kafka-init
    profiles: ["kafka"]
    restart: "no"
    command: ["init"]
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9092
      KAFKA_TOPICS: ${KAFKA_TOPICS}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS}
      KAFKA_TOPIC_REPLICATION: ${KAFKA_TOPIC_REPLICATION}

  # =========================================================================
  # HDFS — profile: hdfs
  # Configuration is baked into openrec/hadoop (hadoop/conf/*.xml). The
  # namenode formats itself on first start by checking for
  # current/VERSION in its name dir, so the volume mounts straight onto it.
  # =========================================================================
  namenode:
    <<: *hadoop-image
    container_name: namenode
    hostname: namenode
    profiles: ["hdfs"]
    command: ["namenode"]
    ports:
      - "${NAMENODE_UI_PORT}:9870"
      - "${NAMENODE_RPC_PORT}:8020"
    volumes:
      - namenode-data:/opt/hadoop/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9870' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  datanode-1:
    <<: *hadoop-image
    container_name: datanode-1
    hostname: datanode-1
    profiles: ["hdfs"]
    command: ["datanode"]
    depends_on:
      namenode: {condition: service_healthy}
    ports:
      - "${DATANODE1_UI_PORT}:9864"
    volumes:
      - datanode-data-1:/opt/hadoop/dfs/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9864' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  datanode-2:
    <<: *hadoop-image
    container_name: datanode-2
    hostname: datanode-2
    profiles: ["hdfs"]
    command: ["datanode"]
    depends_on:
      namenode: {condition: service_healthy}
    ports:
      - "${DATANODE2_UI_PORT}:9864"
    volumes:
      - datanode-data-2:/opt/hadoop/dfs/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9864' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # One-shot: waits until HDFS accepts writes, then lays out the directories
  # Hive, HBase and the Spark history server expect. Everything downstream
  # depends on *this* completing rather than on the namenode being up, because
  # "namenode listening" and "HDFS usable" are not the same thing.
  hdfs-init:
    <<: *hadoop-image
    container_name: hdfs-init
    profiles: ["hdfs"]
    restart: "no"
    command: ["init"]
    depends_on:
      namenode: {condition: service_healthy}
      datanode-1: {condition: service_healthy}
      datanode-2: {condition: service_healthy}

  # =========================================================================
  # YARN — profile: yarn
  # Needed by Hive (Hive 4 dropped the MR engine and runs on Tez) and
  # available as an alternative to the Spark standalone master.
  # =========================================================================
  resourcemanager:
    <<: *hadoop-image
    container_name: resourcemanager
    hostname: resourcemanager
    profiles: ["yarn"]
    command: ["resourcemanager"]
    depends_on:
      hdfs-init: {condition: service_completed_successfully}
    ports:
      - "${RESOURCEMANAGER_UI_PORT}:8088"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8088' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  nodemanager-1:
    <<: *hadoop-image
    container_name: nodemanager-1
    hostname: nodemanager-1
    profiles: ["yarn"]
    command: ["nodemanager"]
    depends_on:
      resourcemanager: {condition: service_healthy}
    ports:
      - "${NODEMANAGER1_UI_PORT}:8042"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8042' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  nodemanager-2:
    <<: *hadoop-image
    container_name: nodemanager-2
    hostname: nodemanager-2
    profiles: ["yarn"]
    command: ["nodemanager"]
    depends_on:
      resourcemanager: {condition: service_healthy}
    ports:
      - "${NODEMANAGER2_UI_PORT}:8042"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8042' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # =========================================================================
  # Hive — profile: hive
  # Warehouse on HDFS, metadata in Postgres. The roles below are plain Hive
  # commands (`hive --service metastore`, `schematool`), not the vendor
  # image's SERVICE_NAME indirection.
  # =========================================================================
  hive-metastore-db:
    image: postgres:${POSTGRES_VERSION}
    container_name: hive-metastore-db
    hostname: hive-metastore-db
    profiles: ["hive"]
    restart: unless-stopped
    networks: [openrec-bigdata]
    environment:
      POSTGRES_DB: ${HIVE_DB_NAME}
      POSTGRES_USER: ${HIVE_DB_USER}
      POSTGRES_PASSWORD: ${HIVE_DB_PASSWORD}
    ports:
      - "${HIVE_PG_PORT}:5432"
    volumes:
      - hive-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HIVE_DB_USER} -d ${HIVE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot: creates or upgrades the metastore schema (-initOrUpgradeSchema is
  # idempotent, so it is safe on every boot).
  hive-schema-init:
    <<: *hive-image
    container_name: hive-schema-init
    profiles: ["hive"]
    restart: "no"
    command: ["schematool"]
    depends_on:
      hive-metastore-db: {condition: service_healthy}
    environment:
      HIVE_DB_HOST: hive-metastore-db
      HIVE_DB_TYPE: postgres
    volumes: *hive-conf

  # One-shot: publishes Hive's jars into the hive-libs volume for Spark.
  hive-libs-init:
    <<: *hive-image
    container_name: hive-libs-init
    profiles: ["hive"]
    restart: "no"
    command: ["publish-libs"]
    volumes:
      - hive-libs:/hive-libs

  hive-metastore:
    <<: *hive-image
    container_name: hive-metastore
    hostname: hive-metastore
    profiles: ["hive"]
    command: ["metastore"]
    depends_on:
      hive-schema-init: {condition: service_completed_successfully}
      hdfs-init: {condition: service_completed_successfully}
    environment:
      HADOOP_CLIENT_OPTS: ${HIVE_METASTORE_HEAP}
    ports:
      - "${HIVE_METASTORE_PORT}:9083"
    volumes: *hive-conf
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9083' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  hiveserver2:
    <<: *hive-image
    container_name: hiveserver2
    hostname: hiveserver2
    profiles: ["hive"]
    command: ["hiveserver2"]
    depends_on:
      hive-metastore: {condition: service_healthy}
    environment:
      HADOOP_CLIENT_OPTS: ${HIVESERVER2_HEAP}
    ports:
      - "${HIVESERVER2_PORT}:10000"
      - "${HIVESERVER2_UI_PORT}:10002"
    volumes: *hive-conf
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10000' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  # =========================================================================
  # HBase — profile: hbase
  # Fully distributed: regions on HDFS, coordination on the ZooKeeper ensemble.
  # =========================================================================
  hbase-master:
    <<: *hbase-image
    container_name: hbase-master
    hostname: hbase-master
    profiles: ["hbase"]
    command: ["master"]
    depends_on:
      zookeeper-1: {condition: service_healthy}
      zookeeper-2: {condition: service_healthy}
      zookeeper-3: {condition: service_healthy}
      hdfs-init: {condition: service_completed_successfully}
    environment:
      HBASE_HEAPSIZE: ${HBASE_MASTER_HEAPSIZE}
    ports:
      - "${HBASE_MASTER_PORT}:16000"
      - "${HBASE_MASTER_UI_PORT}:16010"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/16010' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  hbase-regionserver-1:
    <<: *hbase-image
    container_name: hbase-regionserver-1
    hostname: hbase-regionserver-1
    profiles: ["hbase"]
    command: ["regionserver"]
    depends_on:
      hbase-master: {condition: service_healthy}
    environment:
      HBASE_HEAPSIZE: ${HBASE_REGIONSERVER_HEAPSIZE}
    ports:
      - "${HBASE_RS1_PORT}:16020"
      - "${HBASE_RS1_UI_PORT}:16030"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/16030' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  hbase-regionserver-2:
    <<: *hbase-image
    container_name: hbase-regionserver-2
    hostname: hbase-regionserver-2
    profiles: ["hbase"]
    command: ["regionserver"]
    depends_on:
      hbase-master: {condition: service_healthy}
    environment:
      HBASE_HEAPSIZE: ${HBASE_REGIONSERVER_HEAPSIZE}
    ports:
      - "${HBASE_RS2_PORT}:16020"
      - "${HBASE_RS2_UI_PORT}:16030"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/16030' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  # Thrift gateway: how non-JVM clients (Python's happybase) reach HBase.
  hbase-thrift:
    <<: *hbase-image
    container_name: hbase-thrift
    hostname: hbase-thrift
    profiles: ["hbase"]
    command: ["thrift"]
    depends_on:
      hbase-master: {condition: service_healthy}
    environment:
      HBASE_HEAPSIZE: 1g
    ports:
      - "${HBASE_THRIFT_PORT}:9090"
      - "${HBASE_THRIFT_UI_PORT}:9095"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9090' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  # =========================================================================
  # Spark — profile: spark
  # Standalone cluster. The image carries the spark-sql-kafka connector, so
  # structured streaming against the brokers above needs no --packages.
  # =========================================================================
  spark-master:
    <<: *spark-image
    container_name: spark-master
    hostname: spark-master
    profiles: ["spark"]
    command: ["master"]
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_DAEMON_MEMORY: ${SPARK_DAEMON_MEMORY}
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
    volumes: *spark-conf
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  spark-worker-1:
    <<: *spark-image
    container_name: spark-worker-1
    hostname: spark-worker-1
    profiles: ["spark"]
    command: ["worker"]
    depends_on:
      spark-master: {condition: service_healthy}
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
      SPARK_DAEMON_MEMORY: ${SPARK_DAEMON_MEMORY}
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_WORKER1_UI_PORT}:8081"
    volumes: *spark-conf
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  spark-worker-2:
    <<: *spark-image
    container_name: spark-worker-2
    hostname: spark-worker-2
    profiles: ["spark"]
    command: ["worker"]
    depends_on:
      spark-master: {condition: service_healthy}
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
      SPARK_DAEMON_MEMORY: ${SPARK_DAEMON_MEMORY}
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_WORKER2_UI_PORT}:8081"
    volumes: *spark-conf
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  spark-history:
    <<: *spark-image
    container_name: spark-history
    hostname: spark-history
    profiles: ["spark"]
    command: ["history"]
    depends_on:
      hdfs-init: {condition: service_completed_successfully}
    environment:
      SPARK_DAEMON_MEMORY: ${SPARK_DAEMON_MEMORY}
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_HISTORY_UI_PORT}:18080"
    volumes: *spark-conf
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18080' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  jupyterlab:
    <<: *spark-image
    container_name: jupyterlab
    hostname: jupyterlab
    profiles: ["spark"]
    command: ["jupyter"]
    depends_on:
      spark-master: {condition: service_healthy}
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      JUPYTER_WORKDIR: /opt/workspace
    ports:
      - "${JUPYTERLAB_PORT}:8888"
      - "${SPARK_DRIVER_UI_PORT}:4040"
    volumes: *spark-conf
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8888' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # =========================================================================
  # Flink — profile: flink
  # A peer of Spark for stateful Kafka feature processing. Checkpoints and
  # savepoints are durable on HDFS; uploaded job jars are distributed by Flink.
  # =========================================================================
  flink-jobmanager:
    <<: *flink-image
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    profiles: ["flink"]
    command: ["jobmanager"]
    depends_on:
      hdfs-init: {condition: service_completed_successfully}
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      HADOOP_CONF_DIR: /opt/hadoop/conf
      FLINK_PROPERTIES: |
        jobmanager.memory.process.size: ${FLINK_JOBMANAGER_MEMORY}
    ports:
      - "${FLINK_JOBMANAGER_UI_PORT}:8081"
    volumes: *flink-conf
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  flink-taskmanager-1:
    <<: *flink-image
    container_name: flink-taskmanager-1
    hostname: flink-taskmanager-1
    profiles: ["flink"]
    command: ["taskmanager"]
    depends_on:
      flink-jobmanager: {condition: service_healthy}
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      HADOOP_CONF_DIR: /opt/hadoop/conf
      FLINK_PROPERTIES: |
        taskmanager.memory.process.size: ${FLINK_TASKMANAGER_MEMORY}
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS}
    volumes: *flink-conf

  flink-taskmanager-2:
    <<: *flink-image
    container_name: flink-taskmanager-2
    hostname: flink-taskmanager-2
    profiles: ["flink"]
    command: ["taskmanager"]
    depends_on:
      flink-jobmanager: {condition: service_healthy}
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      HADOOP_CONF_DIR: /opt/hadoop/conf
      FLINK_PROPERTIES: |
        taskmanager.memory.process.size: ${FLINK_TASKMANAGER_MEMORY}
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS}
    volumes: *flink-conf

  # =========================================================================
  # Redis — profile: redis
  # The serving-layer store rec-server reads on every request. Key layout:
  # recall-engine/redis/design.md.
  #
  # Single node, no password: rec-server's RedisConfig builds a plain
  # JedisConnectionFactory and rank-engine uses redis.Redis — neither is
  # cluster-aware and neither authenticates.
  # =========================================================================
  redis:
    image: ${IMAGE_PREFIX}/redis:${REDIS_VERSION}
    build:
      context: ./redis
      args:
        REDIS_BASE_IMAGE: ${REDIS_BASE_IMAGE}
    container_name: redis
    hostname: redis
    profiles: ["redis"]
    restart: unless-stopped
    networks: [openrec-bigdata]
    # Appended to the image's redis-server + config file; flags win over it.
    command:
      - --maxmemory
      - "${REDIS_MAXMEMORY}"
      - --maxmemory-policy
      - "${REDIS_MAXMEMORY_POLICY}"
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # =========================================================================
  # Airflow — profile: airflow
  # Lightweight orchestration for OpenRec's daily Hive/Spark algorithm jobs.
  # LocalExecutor runs task processes on the scheduler container; no Celery
  # broker or permanently running worker pool is required.
  # =========================================================================
  airflow-db:
    image: postgres:15-alpine
    container_name: airflow-db
    hostname: airflow-db
    profiles: ["airflow"]
    restart: unless-stopped
    networks: [openrec-bigdata]
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    profiles: ["airflow"]
    restart: "no"
    command: ["airflow", "db", "migrate"]
    depends_on:
      airflow-db: {condition: service_healthy}

  airflow-api-server:
    <<: *airflow-common
    container_name: airflow-api-server
    hostname: airflow-api-server
    profiles: ["airflow"]
    command: ["airflow", "api-server", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    ports:
      - "${AIRFLOW_API_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    profiles: ["airflow"]
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      airflow-api-server: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    hostname: airflow-dag-processor
    profiles: ["airflow"]
    command: ["airflow", "dag-processor"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 30s

  # =========================================================================
  # Elasticsearch — profile: elasticsearch
  # Holds the per-scene vector index EmbeddingNode kNN-searches
  # ({scene}-item-vector-index; see recall-engine/es/design.md).
  #
  # TLS and auth are on because the clients require them, and the image
  # generates its own self-signed certificate on first start.
  # =========================================================================
  elasticsearch:
    image: ${IMAGE_PREFIX}/elasticsearch:${ELASTIC_VERSION}
    build:
      context: ./elasticsearch
      args:
        ELASTIC_BASE_IMAGE: ${ELASTIC_BASE_IMAGE}
    container_name: elasticsearch
    hostname: elasticsearch
    profiles: ["elasticsearch"]
    restart: unless-stopped
    networks: [openrec-bigdata]
    command: ["server"]
    environment:
      # Settings live in elasticsearch/conf/elasticsearch.yml. Passing one here
      # as well would duplicate it and stop the node from starting.
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: ${ELASTIC_HEAP}
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    ports:
      - "${ELASTIC_HTTP_PORT}:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
      - elastic-certs:/usr/share/elasticsearch/config/certs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert config/certs/ca/ca.crt -u elastic:${ELASTIC_PASSWORD} 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
